# Debian/Ubuntu VPS: /etc/nginx/sites-available/itasii
# Replace example.com with your domain before enabling this site.
# Replace 203.0.113.10 in the second block with your public server IPv4.
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    root /var/www/itasii/public;
    index index.html;
    charset utf-8;
    autoindex off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}

# Keep IP access separate so domain HTTPS redirects do not affect it.
server {
    listen 80;
    listen [::]:80;
    server_name 203.0.113.10;

    root /var/www/itasii/public;
    index index.html;
    charset utf-8;
    autoindex off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
